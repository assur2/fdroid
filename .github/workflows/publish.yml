name: Publish Notes catalog
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    environment: catalog-signing
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install F-Droid and Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver
          sdkmanager 'build-tools;35.0.0'
      - name: Assemble and verify public release APKs
        env:
          NOTES_REPO: ${{ vars.NOTES_REPO }}
          APK_SHA256: ${{ vars.APK_SHA256 }}
          APP_ID: ${{ vars.APP_ID }}
          GH_TOKEN: ${{ secrets.NOTES_RELEASE_READ_TOKEN }}
        run: /usr/bin/python3 catalog.py
      - name: Sign catalog
        env:
          KEYSTORE: ${{ secrets.CATALOG_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.CATALOG_PASSWORD }}
          FEED_URL: ${{ vars.FEED_URL }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/catalog.p12"
          trap 'rm -f "$key" config.yml' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          /usr/bin/python3 - <<'PY'
          import os, yaml
          from pathlib import Path
          config = dict(repo_name="Notes", repo_description="Official Notes releases",
                        repo_url=os.environ["FEED_URL"], repo_icon="icon.png",
                        keystore=str(Path(os.environ["RUNNER_TEMP"]) / "catalog.p12"),
                        repo_keyalias="catalog", keystorepass=os.environ["PASSWORD"],
                        keypass=os.environ["PASSWORD"], make_current_version_link=False,
                        archive_older=0)
          Path("config.yml").write_text(yaml.safe_dump(config))
          PY
          mkdir -p repo/icons
          cp icon.png repo/icons/icon.png
          fdroid update
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          repo = Path("repo")
          entries = json.loads((repo / "index-v1.json").read_text())["packages"]
          indexed = {v["apkName"] for versions in entries.values() for v in versions}
          expected = set(Path("expected-apks.txt").read_text().splitlines())
          assert expected and indexed == expected, (expected, indexed)
          assert (repo / "index-v1.jar").stat().st_size > 0
          PY
          mkdir -p site/fdroid
          cp -R repo site/fdroid/
          chmod -R a+rX site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: catalog
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
