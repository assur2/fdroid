name: Build signed Notes catalog
description: Verify release APKs, collect their source archives and sign the F-Droid index.
inputs:
  keystore:
    description: Base64 catalog signing keystore
    required: true
  password:
    description: Catalog signing password
    required: true
runs:
  using: composite
  steps:
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install catalog tools
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/fdroid-tools"
        "$RUNNER_TEMP/fdroid-tools/bin/pip" install 'fdroidserver==2.4.5' 'androguard==4.1.4'
        echo "$RUNNER_TEMP/fdroid-tools/bin" >> "$GITHUB_PATH"
        sdkmanager 'build-tools;35.0.0'
    - name: Prepare catalog in an isolated directory
      shell: bash
      run: |
        mkdir "$RUNNER_TEMP/notes-catalog"
        cd "$RUNNER_TEMP/notes-catalog"
        cp "$GITHUB_ACTION_PATH/icon.png" .
        python3 "$GITHUB_ACTION_PATH/catalog.py"
    - name: Sign and check the index
      shell: bash
      env:
        KEYSTORE: ${{ inputs.keystore }}
        PASSWORD: ${{ inputs.password }}
      run: |
        cd "$RUNNER_TEMP/notes-catalog"
        bash "$GITHUB_ACTION_PATH/sign.sh"
